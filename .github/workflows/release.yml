name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build modules and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Jars
        run: ./gradlew clean build shadowJar

      - name: Get Project Version
        id: project_version
        run: echo "PROJECT_VERSION=$(./gradlew properties -q | grep "version:" | awk '{print $2}')" >> $GITHUB_ENV

      - name: Publish to Maven Central
        run: |
          ./gradlew \
            :custom-names-api:publishAllPublicationsToCentralPortal \
            :custom-names-minestom:publishAllPublicationsToCentralPortal \
            -PsonatypeUsername="${{ secrets.SONATYPE_USERNAME }}" \
            -PsonatypePassword="${{ secrets.SONATYPE_PASSWORD }}" \
            -PsigningKey="${{ secrets.SIGNING_KEY }}" \
            -PsigningPassword="${{ secrets.SIGNING_PASSWORD }}"

      - name: Create Release
        run: |
          jars=()
          for jar in $(find . -type f -name "*.jar" -path "*/build/libs/*.jar" -not -path "./build/libs/*"); do
            if [[ $(basename "$jar") =~ -[0-9]+\.[0-9]+ ]]; then
              echo "Skipping $jar due to version number"
            else
              echo "Uploading $jar"
              jars+=("$jar")
            fi
          done
          gh release create "v${PROJECT_VERSION}" \
            --target main \
            --title "v${PROJECT_VERSION}" \
            --notes "This release contains release builds for all Gradle modules." \
            "${jars[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}